name: Build QuickMemo11 Band 11 RPK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-rpk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/QuickMemo11
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/QuickMemo11/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Validate project
        run: npm run validate

      - name: Check AIoT Toolkit
        run: |
          npx aiot --version
          node --version
          npm --version

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build RPK
        run: |
          set -e
          npm run build
          test -d build
          find build -maxdepth 4 -type f -print | sort

      - name: Find RPK output
        shell: bash
        run: |
          set -e
          mkdir -p artifacts
          mapfile -t RPK_FILES < <(find . -type f -name "*.rpk" -not -path "./node_modules/*")
          if [ "${#RPK_FILES[@]}" -eq 0 ]; then
            echo "::error::Build completed but no .rpk file was found."
            exit 1
          fi
          VERSION="${{ steps.version.outputs.version }}"
          cp "${RPK_FILES[0]}" "artifacts/QuickMemo11-v${VERSION}.rpk"

      - name: Upload RPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: quickmemo-band11-rpk-${{ github.sha }}
          path: apps/QuickMemo11/artifacts/*.rpk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release Asset
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: quickmemo11-v${{ steps.version.outputs.version }}
          name: QuickMemo11 v${{ steps.version.outputs.version }}
          body: |
            QuickMemo11 — Xiaomi Smart Band 11 Vela App
          files: apps/QuickMemo11/artifacts/*.rpk
          fail_on_unmatched_files: true
