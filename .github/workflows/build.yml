name: Build RPK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-rpk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Check project files
        run: |
          echo "=== Node ==="
          node --version

          echo "=== npm ==="
          npm --version

          echo "=== package.json ==="
          cat package.json

          echo "=== Project files ==="
          ls -la

      - name: Install dependencies
        run: npm ci

      - name: Verify AIoT toolkit
        run: |
          echo "=== aiot-toolkit installed ==="
          npm ls aiot-toolkit

          echo "=== npx aiot-toolkit ==="
          npx --yes aiot-toolkit --help

      - name: Restore release signing
        env:
          RELEASE_PRIVATE_PEM: ${{ secrets.RELEASE_PRIVATE_PEM }}
          RELEASE_CERTIFICATE_PEM: ${{ secrets.RELEASE_CERTIFICATE_PEM }}
        run: |
          test -n "$RELEASE_PRIVATE_PEM"
          test -n "$RELEASE_CERTIFICATE_PEM"

          mkdir -p sign/release

          printf '%s' "$RELEASE_PRIVATE_PEM" \
            > sign/release/private.pem

          printf '%s' "$RELEASE_CERTIFICATE_PEM" \
            > sign/release/certificate.pem

          chmod 600 \
            sign/release/private.pem \
            sign/release/certificate.pem

      - name: Build release RPK
        run: npm run release

      - name: Find RPK
        id: rpk
        shell: bash
        run: |
          echo "=== Searching for RPK ==="

          RPK="$(find . -type f -name '*.rpk' -print -quit)"

          if [ -z "$RPK" ]; then
            echo "ERROR: No RPK file was generated."
            echo "=== Directory listing ==="
            find . -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "Found RPK: $RPK"
          echo "path=$RPK" >> "$GITHUB_OUTPUT"

      - name: Upload RPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: band-memo-rpk
          path: ${{ steps.rpk.outputs.path }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "${{ steps.rpk.outputs.path }}" \
            --title "Band Memo ${GITHUB_REF_NAME}" \
            --generate-notes
