name: Build RPK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-rpk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check Vela project
        run: |
          set -o pipefail
          echo "Listing files for debug:"
          ls -la src || true
          test -f src/manifest.json
          test -f src/app.ux
          test -f src/pages/index/index.ux
          test -f src/pages/settings/settings.ux

          echo '--- src/manifest.json ---'
          cat src/manifest.json || true
          echo '------------------------'

          node -e "try{ const m=require('./src/manifest.json'); const required=['package','name','icon','versionCode','router']; const missing=required.filter(k=>{ const v=m[k]; return v===undefined||v===null||v==='' }); if(missing.length){ console.error('Missing manifest keys:', missing.join(', ')); process.exit(1);} console.log('manifest OK'); } catch(e){ console.error('Failed to load manifest.json:', e && e.message); process.exit(1); }"

      - name: Restore release signing
        env:
          RELEASE_PRIVATE_PEM: ${{ secrets.RELEASE_PRIVATE_PEM }}
          RELEASE_CERTIFICATE_PEM: ${{ secrets.RELEASE_CERTIFICATE_PEM }}
        run: |
          test -n "$RELEASE_PRIVATE_PEM"
          test -n "$RELEASE_CERTIFICATE_PEM"
          mkdir -p sign
          printf '%s' "$RELEASE_PRIVATE_PEM" > sign/private.pem
          printf '%s' "$RELEASE_CERTIFICATE_PEM" > sign/certificate.pem
          chmod 600 sign/private.pem sign/certificate.pem

      - name: Build release RPK
        run: npm run release

      - name: Find RPK
        id: rpk
        shell: bash
        run: |
          RPK="$(find dist -type f -name '*.rpk' -print -quit 2>/dev/null || true)"
          test -n "$RPK"
          echo "Found RPK: $RPK"
          echo "path=$RPK" >> "$GITHUB_OUTPUT"

      - name: Upload RPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: band-memo-rpk
          path: ${{ steps.rpk.outputs.path }}

        - name: Create GitHub Release
    id: create_release
    uses: actions/create-release@v1
    with:
      tag_name: ${{ github.ref_name }}
      release_name: Band Memo ${{ github.ref_name }}
      body: Release generated by CI
      draft: false
      prerelease: false
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  - name: Upload RPK to release
    uses: actions/upload-release-asset@v1
    with:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      asset_path: ${{ steps.rpk.outputs.path }}
      asset_name: ${{ steps.rpk.outputs.path }}
      asset_content_type: application/octet-stream
