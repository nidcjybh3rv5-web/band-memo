name: Build RPK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-rpk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check Vela project
        run: |
          test -f src/manifest.json
          test -f src/app.ux
          test -f src/pages/index/index.ux
          test -f src/pages/settings/settings.ux
          node -e "const m=require('./src/manifest.json'); if(!m.package||!m.name||!m.icon||!m.versionCode||!m.router) process.exit(1)"

      - name: Restore release signing
        env:
          RELEASE_PRIVATE_PEM: ${{ secrets.RELEASE_PRIVATE_PEM }}
          RELEASE_CERTIFICATE_PEM: ${{ secrets.RELEASE_CERTIFICATE_PEM }}
        run: |
          test -n "$RELEASE_PRIVATE_PEM"
          test -n "$RELEASE_CERTIFICATE_PEM"
          mkdir -p sign
          printf '%s' "$RELEASE_PRIVATE_PEM" > sign/private.pem
          printf '%s' "$RELEASE_CERTIFICATE_PEM" > sign/certificate.pem
          chmod 600 sign/private.pem sign/certificate.pem

      - name: Build release RPK
        run: npm run release

      - name: Find RPK
        id: rpk
        shell: bash
        run: |
          RPK="$(find dist -type f -name '*.rpk' -print -quit 2>/dev/null || true)"
          test -n "$RPK"
          echo "Found RPK: $RPK"
          echo "path=$RPK" >> "$GITHUB_OUTPUT"

      - name: Upload RPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: band-memo-rpk
          path: ${{ steps.rpk.outputs.path }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "${{ steps.rpk.outputs.path }}" \
            --title "Band Memo ${GITHUB_REF_NAME}" \
            --generate-notes

      - name: Remove signing files
        if: always()
        run: rm -f sign/private.pem sign/certificate.pem
