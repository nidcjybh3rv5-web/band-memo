name: Build QuickMemo9 Band 9 RPK

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-rpk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/QuickMemo9
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/QuickMemo9/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Validate project
        run: npm run validate

      - name: Check AIoT Toolkit
        run: |
          npx aiot --version
          node --version
          npm --version

      - name: Build RPK
        run: |
          set -e
          npm run build
          test -d build
          find build -maxdepth 4 -type f -print | sort

      - name: Find RPK output
        shell: bash
        run: |
          set -e
          mkdir -p artifacts
          mapfile -t RPK_FILES < <(find . -type f -name "*.rpk" -not -path "./node_modules/*" -not -path "./artifacts/*")
          if [ "${#RPK_FILES[@]}" -eq 0 ]; then
            echo "::error::Build completed but no .rpk file was found."
            exit 1
          fi
          VERSION=$(node -p "require('./package.json').version")
          cp "${RPK_FILES[0]}" "artifacts/QuickMemo9-v${VERSION}.rpk"

      - name: Upload RPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: quickmemo9-rpk-${{ github.sha }}
          path: apps/QuickMemo9/artifacts/*.rpk
          if-no-files-found: error
          retention-days: 14
